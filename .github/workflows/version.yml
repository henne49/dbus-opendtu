name: Versioning

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -e

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="0.0.0"
          if [[ -f version.txt ]]; then
            CURRENT=$(grep -E '^Version:' version.txt | head -n1 | awk '{print $2}' || true)
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version file
        shell: bash
        run: |
          echo "Version: ${{ steps.version.outputs.version }}" > version.txt

      - name: Commit
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.txt
          git commit -m "Update version to ${{ steps.version.outputs.version }} [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          repository: henne49/dbus-opendtu
          force_with_lease: true