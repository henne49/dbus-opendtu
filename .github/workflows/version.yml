name: Versioning

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to write to main before creating its release tag (for example 2.2.2)
        required: false
        type: string

jobs:
  versioning:
    name: Versioning
    environment: versioning
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -e

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
            VERSION="${TAG#v}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_VERSION" ]]; then
            VERSION="${RELEASE_VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $RELEASE_VERSION (expected X.Y.Z or vX.Y.Z)" >&2
              exit 1
            fi
          else
            CURRENT="0.0.0"
            if [[ -f version.txt ]]; then
              CURRENT=$(grep -E '^Version:' version.txt | head -n1 | awk '{print $2}' || true)
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version file
        shell: bash
        run: |
          echo "Version: ${{ steps.version.outputs.version }}" > version.txt

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add version.txt

          if git diff --cached --quiet; then
            echo "No version change required"
            exit 0
          fi

          git commit -m "Update version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main